<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Helix bounded Linux compatibility path</title>
  <desc id="desc">A static Linux ELF enters Helix's profile-gated syscall dispatcher, which validates ABI arguments and user memory, adapts integer file descriptors to Helix stream objects, and confines storage access to the native namespace and bounded directory snapshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#e8effb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17325f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6682ad"/>
    </marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#40836e"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="36" y="42" fill="#163155" font-family="Segoe UI, Selawik, Arial, sans-serif" font-size="21" font-weight="700">Helix · bounded Linux compatibility path</text>
  <text x="36" y="67" fill="#526b8c" font-family="Segoe UI, Selawik, Arial, sans-serif" font-size="14">Development profile · Linux syscall numbers · no Linux kernel code runs in the guest</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Selawik, Arial, sans-serif">
    <rect x="36" y="104" width="190" height="116" rx="16" fill="#fff" stroke="#cad7eb"/>
    <rect x="36" y="104" width="7" height="116" rx="3.5" fill="url(#accent)"/>
    <text x="58" y="138" fill="#17325f" font-size="16" font-weight="700">Static Linux ELF</text>
    <text x="58" y="164" fill="#526b8c" font-size="13">/compat/linux/</text>
    <text x="58" y="186" fill="#526b8c" font-size="13">ET_EXEC · bounded PT_LOAD</text>

    <rect x="276" y="104" width="200" height="116" rx="16" fill="#fff" stroke="#cad7eb"/>
    <rect x="276" y="104" width="7" height="116" rx="3.5" fill="url(#accent)"/>
    <text x="298" y="138" fill="#17325f" font-size="16" font-weight="700">Personality gate</text>
    <text x="298" y="164" fill="#526b8c" font-size="13">Linux dispatcher</text>
    <text x="298" y="186" fill="#526b8c" font-size="13">Native ABI stays separate</text>

    <rect x="526" y="104" width="200" height="116" rx="16" fill="#fff" stroke="#cad7eb"/>
    <rect x="526" y="104" width="7" height="116" rx="3.5" fill="url(#accent)"/>
    <text x="548" y="138" fill="#17325f" font-size="16" font-weight="700">ABI boundary</text>
    <text x="548" y="164" fill="#526b8c" font-size="13">Argument + pointer checks</text>
    <text x="548" y="186" fill="#526b8c" font-size="13">Linux errno and record layouts</text>

    <rect x="776" y="104" width="186" height="116" rx="16" fill="#fff" stroke="#cad7eb"/>
    <rect x="776" y="104" width="7" height="116" rx="3.5" fill="#4b91b2"/>
    <text x="798" y="138" fill="#17325f" font-size="16" font-weight="700">FD adapter</text>
    <text x="798" y="164" fill="#526b8c" font-size="13">Generation-checked</text>
    <text x="798" y="186" fill="#526b8c" font-size="13">shared stream objects</text>

    <rect x="1012" y="104" width="152" height="116" rx="16" fill="#fff" stroke="#cad7eb"/>
    <rect x="1012" y="104" width="7" height="116" rx="3.5" fill="#32866c"/>
    <text x="1034" y="138" fill="#17325f" font-size="16" font-weight="700">Helix VFS</text>
    <text x="1034" y="164" fill="#526b8c" font-size="13">/native grant</text>
    <text x="1034" y="186" fill="#526b8c" font-size="13">COW + snapshots</text>
  </g>

  <g fill="none" stroke="#6682ad" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M228 162h40"/><path d="M478 162h40"/><path d="M728 162h40"/><path d="M964 162h40"/>
  </g>
  <g fill="#526b8c" font-family="Segoe UI, Selawik, Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="248" y="145">SYSCALL</text><text x="498" y="145">validate</text><text x="748" y="145">adapt</text><text x="984" y="145">confine</text>
  </g>
  <path d="M1100 246H132Q112 246 112 226" fill="none" stroke="#40836e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#return)"/>
  <rect x="445" y="231" width="310" height="28" rx="14" fill="#e5f4ee"/>
  <text x="600" y="250" text-anchor="middle" fill="#276e59" font-family="Segoe UI, Selawik, Arial, sans-serif" font-size="13" font-weight="600">bounded result or Linux errno returns to the process</text>
</svg>
