[package]
name = "next-checks"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
# The boot loader source is included by host checks for shared parser tests.
# Declare its smoke-only cfg so strict check-cfg remains enabled there too.
ab-smoke = []

[dependencies]
helix-core = { path = "../helix-core" }
prism = { path = "../prism" }
next-abi = { path = "../next-abi" }
next-fs = { path = "../next-fs" }
next-package = { path = "../next-package" }
