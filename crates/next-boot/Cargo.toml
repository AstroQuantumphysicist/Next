[package]
name = "next-boot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
[features]
default = []
# QEMU-only persistence scenario; first boot stages the prepared B fixture.
# Never enable this feature for a product image.
ab-smoke = []

[[bin]]
name = "next-boot"
path = "src/main.rs"
test = false
bench = false

[dependencies]
next-abi = { path = "../next-abi" }
next-package = { path = "../next-package" }
